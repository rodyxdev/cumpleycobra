# Proxy del paso BUILD del verificador (fase 3). Única salida a internet de la red interna
# `cc-build`: solo PyPI y npm, solo por HTTPS (CONNECT al 443). Sin caché ni registro de cuerpos.
http_port 3128

acl permitidos dstdomain pypi.org files.pythonhosted.org registry.npmjs.org
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny !permitidos
http_access deny CONNECT !SSL_ports
http_access deny !CONNECT
http_access allow permitidos
http_access deny all

cache deny all
access_log stdio:/dev/stdout
cache_log /dev/stderr
pid_filename none
shutdown_lifetime 1 seconds
